    <path d="M 256 100 L 340 185 L 256 270 L 172 185 Z" fill="none" stroke="#CA8A04" stroke-width="7" opacity="0.3" stroke-linejoin="round"/>
    
    <!-- KMK Monogram -->
    <g fill="none" stroke="#064E3B" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left K -->
