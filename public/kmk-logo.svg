    <!-- Subtitle Text -->
    <text x="256" y="325" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="22" font-weight="700" fill="#0F172A" letter-spacing="4" text-anchor="middle">KELLY MUTHOMI KINOTI</text>
  </g>
