<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Badge Pill -->
  <rect x="90" y="110" rx="20" ry="20" width="310" height="40" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="110" y="135" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" letter-spacing="1.5">TSC-LICENSED EDUCATOR &amp; ENGINEER</text>

  <!-- Main Title -->
  <text x="90" y="240" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="58" font-weight="800" letter-spacing="-1">Kelly Muthomi Kinoti</text>
  <text x="90" y="315" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="600">Full-Stack Software Engineer &amp; EdTech Architect</text>
  <text x="90" y="375" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="400">Quantitative Research &amp; SPSS Data Analyst • STEM Educator</text>

  <!-- Key Competencies Pills -->
  <g transform="translate(90, 435)">
    <rect x="0" y="0" rx="14" ry="14" width="160" height="38" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="80" y="24" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" text-anchor="middle">React &amp; Node.js</text>

    <rect x="180" y="0" rx="14" ry="14" width="150" height="38" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="255" y="24" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" text-anchor="middle">SPSS &amp; STATA</text>

    <rect x="350" y="0" rx="14" ry="14" width="220" height="38" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="460" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" text-anchor="middle">STEM Pedagogy (CBC)</text>

    <rect x="590" y="0" rx="14" ry="14" width="190" height="38" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <text x="685" y="24" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" text-anchor="middle">EdTech Architecture</text>
  </g>

  <!-- Bottom URL & Location -->
  <line x1="90" y1="520" x2="1110" y2="520" stroke="#334155" stroke-width="1"/>
  <text x="90" y="565" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="500">https://kelly-muthomi-kinoti.vercel.app/</text>
  <text x="1110" y="565" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="500" text-anchor="end">NAIROBI, KENYA • TSC LICENSED</text>
</svg>
